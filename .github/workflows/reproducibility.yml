name: Verify archived reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.txt
      - name: Check data, original predictions, partitions and saved metrics
        run: python tools/verify_repository.py
